<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SpeakFlow Logo">
  <title>SpeakFlow Logo</title>
  <defs>
    <!-- Deep Midnight / Navy App Canvas -->
    <linearGradient id="sf-h-bg-midnight" x1="64" y1="36" x2="448" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1935"/>
      <stop offset="45%" stop-color="#081124"/>
      <stop offset="100%" stop-color="#03060E"/>
    </linearGradient>

    <!-- Windows 11 Fluent Rim Sheen -->
    <linearGradient id="sf-h-rim-sheen" x1="90" y1="36" x2="422" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#00F5A0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Mint-to-Aqua Voice-to-Text Stream Gradient -->
    <linearGradient id="sf-h-mint-aqua-flow" x1="120" y1="140" x2="380" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="30%" stop-color="#00E5C9"/>
      <stop offset="70%" stop-color="#00D2F7"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Glowing Text Cursor Gradient -->
    <linearGradient id="sf-h-cursor-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00D2F7"/>
    </linearGradient>

    <!-- Wordmark Gradient for "Flow" -->
    <linearGradient id="sf-h-flow-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00D2F7"/>
    </linearGradient>

    <!-- Core Ambient Bloom -->
    <radialGradient id="sf-h-ambient-bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2F7" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#00F5A0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App Icon Badge on Left (144x144, scale 0.28125 from 512x512) -->
  <g transform="translate(36, 28) scale(0.28125)">
    <rect x="36" y="36" width="440" height="440" rx="112" fill="url(#sf-h-bg-midnight)"/>
    <rect x="37" y="37" width="438" height="438" rx="111" stroke="url(#sf-h-rim-sheen)" stroke-width="2"/>
    <circle cx="256" cy="256" r="140" fill="url(#sf-h-ambient-bloom)"/>

    <path transform="translate(512 0) scale(-1 1)" d="M 166 220
             C 156 176, 194 144, 256 144
             C 324 144, 360 178, 352 220
             C 344 252, 310 266, 256 276
             C 202 286, 168 300, 160 332
             C 152 374, 188 408, 256 408
             C 310 408, 344 382, 350 344"
          fill="none"
          stroke="url(#sf-h-mint-aqua-flow)"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <path transform="translate(512 0) scale(-1 1)" d="M 164 216 Q 140 236 116 244 Q 142 246 170 230 Z" fill="#00F5A0"/>
    <rect x="414" y="296" width="20" height="62" rx="10" fill="url(#sf-h-cursor-glow)"/>
  </g>

  <!-- Typography -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', Roboto, 'Helvetica Neue', sans-serif">
    <text x="204" y="114" font-size="56" letter-spacing="-1.2">
      <tspan fill="#F8FAFC" font-weight="700">Speak</tspan><tspan fill="url(#sf-h-flow-grad)" font-weight="600">Flow</tspan>
    </text>
    <text x="206" y="148" font-size="13" font-weight="600" letter-spacing="3.2" fill="#94A3B8">
      VOICE TO TEXT <tspan fill="#00F5A0">&#8226;</tspan> WINDOWS
    </text>
  </g>
</svg>
