<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SpeakFlow Brand Mark">
  <title>SpeakFlow Brand Mark</title>
  <defs>
    <!-- Mint-to-Aqua Voice-to-Text Stream Gradient -->
    <linearGradient id="sf-mark-flow" x1="120" y1="140" x2="380" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="30%" stop-color="#00E5C9"/>
      <stop offset="70%" stop-color="#00D2F7"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Glowing Text Cursor Gradient -->
    <linearGradient id="sf-mark-cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00D2F7"/>
    </linearGradient>
  </defs>

  <!-- S-Speech Ribbon Monogram & Text Cursor on Transparent Canvas -->
  <g id="sf-brand-mark" transform="translate(-10 -20)">
    <!-- Continuous S-Speech Flow Ribbon -->
    <path transform="translate(512 0) scale(-1 1)" d="M 166 220
             C 156 176, 194 144, 256 144
             C 324 144, 360 178, 352 220
             C 344 252, 310 266, 256 276
             C 202 286, 168 300, 160 332
             C 152 374, 188 408, 256 408
             C 310 408, 344 382, 350 344"
          fill="none"
          stroke="url(#sf-mark-flow)"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Integrated Speech Bubble Pointer Tail (Speech Origin) -->
    <path transform="translate(512 0) scale(-1 1)" d="M 164 216 Q 140 236 116 244 Q 142 246 170 230 Z" fill="#00F5A0"/>

    <!-- Active Text Cursor Cue (Transcription Destination) -->
    <rect x="414" y="296" width="20" height="62" rx="10" fill="url(#sf-mark-cursor)"/>
  </g>
</svg>
