<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SpeakFlow Vertical Logo">
  <title>SpeakFlow Vertical Logo</title>
  <defs>
    <linearGradient id="sf-v-copper" x1="170" y1="80" x2="330" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D67A53"/>
      <stop offset="50%" stop-color="#B85F3A"/>
      <stop offset="100%" stop-color="#914022"/>
    </linearGradient>
    <linearGradient id="sf-v-rim" x1="170" y1="80" x2="330" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="sf-v-shadow" x="140" y="60" width="220" height="220" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5C2510" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- Centered Icon Badge (160x160) -->
  <rect x="170" y="80" width="160" height="160" rx="42" fill="url(#sf-v-copper)" filter="url(#sf-v-shadow)"/>
  <rect x="170.5" y="80.5" width="159" height="159" rx="41.5" stroke="url(#sf-v-rim)" stroke-width="1" fill="none"/>
  <g transform="translate(170, 80) scale(0.3125)">
    <circle cx="170" cy="256" r="22" fill="#FDFCFB"/>
    <path d="M228 174 C 322 174 378 210 386 256 C 378 302 322 338 228 338" stroke="#FDFCFB" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M238 206 C 300 206 338 230 346 256 C 338 282 300 306 238 306" stroke="#FDFCFB" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M248 234 C 284 234 306 244 314 256 C 306 268 284 278 248 278" stroke="#FDFCFB" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Typography -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', Roboto, 'Helvetica Neue', sans-serif">
    <text x="250" y="318" text-anchor="middle" font-size="46" letter-spacing="-1">
      <tspan fill="#1A1A18" font-weight="700">Speak</tspan><tspan fill="#AE5630" font-weight="600">Flow</tspan>
    </text>
    <text x="250" y="356" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="2.6" fill="#5A5854">VOICE TO TEXT · WINDOWS</text>
  </g>
